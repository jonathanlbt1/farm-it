services:
  db:
    image: postgres:16-alpine
    container_name: farm-it-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-farm_it}
      POSTGRES_USER: ${POSTGRES_USER:-farm_it_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-farm_it_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-farm_it_user} -d ${POSTGRES_DB:-farm_it}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: farm-it-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-farm_it_user}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-farm_it_password}
      DB_NAME: ${POSTGRES_DB:-farm_it}
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      BACKEND_ALLOWED_ORIGINS: ${BACKEND_ALLOWED_ORIGINS:-http://localhost:8080}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  frontend:
    build:
      context: ./frontend
      dockerfile: src/Dockerfile
    container_name: farm-it-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "8080:80"

volumes:
  postgres_data:
