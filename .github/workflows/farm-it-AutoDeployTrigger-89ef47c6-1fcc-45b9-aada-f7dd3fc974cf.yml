name: Trigger auto deployment for farm-it

# When this action will be executed
on:
  # Automatically trigger it when detected changes in backend
  push:
    branches: 
      [ main ]
    paths:
    - 'backend/**'
    - '.github/workflows/farm-it-AutoDeployTrigger-89ef47c6-1fcc-45b9-aada-f7dd3fc974cf.yml'

  # Allow manual trigger 
  workflow_dispatch:      

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions: 
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read #Required when GH token is used to authenticate with private repo

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.FARMIT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.FARMIT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.FARMIT_AZURE_SUBSCRIPTION_ID }}

      - name: Validate registry configuration
        id: registry
        shell: bash
        env:
          REGISTRY_URL: ${{ secrets.FARMIT_REGISTRY_URL }}
          ACR_NAME: ${{ secrets.FARMIT_ACR_NAME }}
        run: |
          set -e
          if [ -n "$REGISTRY_URL" ]; then
            registry_host="${REGISTRY_URL#http://}"
            registry_host="${registry_host#https://}"
            registry_host="${registry_host%/}"
          elif [ -n "$ACR_NAME" ]; then
            registry_host="${ACR_NAME}.azurecr.io"
          else
            echo "Registry is not configured. Set FARMIT_REGISTRY_URL (example: myregistry.azurecr.io) or FARMIT_ACR_NAME (example: myregistry)."
            exit 1
          fi

          if [ -z "$registry_host" ]; then
            echo "FARMIT_REGISTRY_URL is invalid after normalization."
            exit 1
          fi

          echo "registry_host=$registry_host" >> "$GITHUB_OUTPUT"

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}/backend
          dockerfilePath: Dockerfile
          registryUrl: ${{ steps.registry.outputs.registry_host }}
          registryUsername: ${{ secrets.FARMIT_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.FARMIT_REGISTRY_PASSWORD }}
          containerAppName: farm-it
          resourceGroup: farm-it
          imageToBuild: ${{ steps.registry.outputs.registry_host }}/farm-it-backend:${{ github.sha }}
          imageToDeploy: ${{ steps.registry.outputs.registry_host }}/farm-it-backend:${{ github.sha }}


